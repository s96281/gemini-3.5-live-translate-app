name: Build and Release .NET 9 + WPF Windows App

on:
  push:
    branches: [ 'main', 'master' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'main', 'master' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag to upload assets to (e.g. v1.0.0)'
        required: false
        default: ''

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore GeminiLiveTranslate.sln

      - name: Run Test Suites
        run: dotnet test GeminiLiveTranslate.sln -c Release --no-restore --verbosity normal

      - name: Publish Single-File Self-Contained Windows x64 Executable
        run: dotnet publish src/GeminiLiveTranslate.App/GeminiLiveTranslate.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish

      - name: Verify and Package Single-File Executable
        shell: pwsh
        run: |
          if ((Test-Path -Path "publish/GeminiLiveTranslate.App.exe" -PathType Leaf) -and -not (Test-Path -Path "publish/GeminiLiveTranslate.exe" -PathType Leaf)) {
            Move-Item -Path "publish/GeminiLiveTranslate.App.exe" -Destination "publish/GeminiLiveTranslate.exe" -Force
          }
          $exePath = "publish/GeminiLiveTranslate.exe"
          if (-not (Test-Path -Path $exePath -PathType Leaf)) {
            throw "Expected single-file executable not found at $exePath"
          }
          $fileInfo = Get-Item -Path $exePath
          if ($fileInfo.Length -le 0) {
            throw "Published executable at $exePath is empty (0 bytes)"
          }
          Write-Host "Verified single-file executable: $($fileInfo.FullName) ($($fileInfo.Length) bytes)"
          Compress-Archive -Path publish/GeminiLiveTranslate.exe -DestinationPath GeminiLiveTranslate-Windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeminiLiveTranslate-Windows-x64
          path: |
            publish/GeminiLiveTranslate.exe
            GeminiLiveTranslate-Windows-x64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: "${{ github.event.inputs.tag_name || github.ref_name }} - Gemini Live Translate Windows 11"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            publish/GeminiLiveTranslate.exe
            GeminiLiveTranslate-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
